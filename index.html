<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Convolution Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a40;
    --accent: #7c6af7;
    --accent2: #f76a8a;
    --accent3: #6af7c4;
    --text: #e8e8f0;
    --muted: #6666aa;
    --highlight: #f7c76a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none; z-index: 0;
  }
  .container {
    max-width: 920px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative; z-index: 1;
  }
  header { margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 24px; }
  header h1 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  header p { margin-top: 6px; color: var(--muted); font-size: 11px; letter-spacing: 1px; }

  .input-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 24px;
    margin-bottom: 36px;
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 16px; align-items: end;
  }
  .field label { display: block; font-size: 11px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .field input {
    width: 100%;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px;
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }
  .compute-btn {
    background: var(--accent); color: white; border: none;
    border-radius: 8px; padding: 11px 24px;
    font-family: 'Syne', sans-serif; font-weight: 700;
    font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .compute-btn:hover { background: #9580ff; transform: translateY(-1px); }

  .section-title {
    font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-title .badge { background: var(--accent); color: white; border-radius: 4px; padding: 2px 8px; font-size: 10px; }

  .method-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 40px; }

  /* Circle method */
  .circle-wrapper { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  #circle-canvas { display: block; }
  .controls { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .ctrl-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px; padding: 8px 18px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    cursor: pointer; transition: all 0.15s;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .step-indicator { font-size: 12px; color: var(--muted); min-width: 70px; text-align: center; }

  .multiplications {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; font-size: 13px; line-height: 1.8; min-height: 60px;
  }
  .mult-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .mult-pair {
    background: var(--surface2); border-radius: 4px; padding: 2px 8px;
    border: 1px solid var(--border); font-size: 12px;
    border-color: var(--highlight); color: var(--highlight);
  }
  .sum-line { color: var(--accent3); font-weight: 600; margin-top: 4px; font-size: 13px; }

  .yn-display { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-size: 13px; width: 100%; }
  .yn-title { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .yn-values { display: flex; flex-wrap: wrap; gap: 8px; }
  .yn-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 4px 12px; font-size: 13px; transition: all 0.3s; }
  .yn-chip.computed { border-color: var(--accent3); color: var(--accent3); }
  .yn-chip.current { border-color: var(--highlight); color: var(--highlight); background: rgba(247,199,106,0.08); }

  /* Matrix method */
  .matrix-eq { display: flex; align-items: center; gap: 14px; overflow-x: auto; padding-bottom: 8px; flex-wrap: wrap; justify-content: center; }
  .matrix-label { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .eq-sign { font-size: 20px; color: var(--muted); }
  .matrix-bracket { display: flex; align-items: stretch; }
  .bracket-left, .bracket-right { width: 10px; border: 2px solid var(--muted); flex-shrink: 0; }
  .bracket-left { border-right: none; border-radius: 4px 0 0 4px; }
  .bracket-right { border-left: none; border-radius: 0 4px 4px 0; }
  .matrix-inner { display: flex; flex-direction: column; gap: 3px; padding: 8px 6px; }
  .matrix-row { display: flex; gap: 6px; padding: 3px 5px; border-radius: 4px; transition: background 0.2s; }
  .matrix-cell { min-width: 26px; text-align: center; font-size: 12px; }
  .matrix-cell.diagonal { color: var(--accent); }
  .vector-inner { display: flex; flex-direction: column; gap: 3px; padding: 8px 6px; }
  .vector-cell { min-width: 26px; text-align: center; font-size: 12px; padding: 3px 6px; }

  .dot-products { margin-top: 20px; }
  .dot-row { background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 12px 16px; margin-bottom: 8px; font-size: 12px; line-height: 1.8; }
  .dot-row .row-label { color: var(--accent); font-weight: 600; margin-bottom: 3px; }
  .dot-row .row-calc { color: var(--muted); }
  .dot-row .row-result { color: var(--accent3); font-weight: 600; }

  .final-result {
    background: var(--surface2); border: 1px solid var(--accent);
    border-radius: 10px; padding: 20px 24px;
    margin-top: 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .final-label { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .final-values { display: flex; flex-wrap: wrap; gap: 8px; }
  .final-chip { background: rgba(124,106,247,0.15); border: 1px solid var(--accent); border-radius: 5px; padding: 4px 12px; font-size: 13px; }

  .error-msg { color: var(--accent2); font-size: 12px; margin-bottom: 16px; }

  @media (max-width: 600px) {
    .input-panel { grid-template-columns: 1fr; }
    .compute-btn { width: 100%; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>Circular <span>Convolution</span> Calculator</h1>
    <p>N-POINT · CIRCLE METHOD + MATRIX METHOD</p>
  </header>

  <div class="input-panel">
    <div class="field">
      <label>x[n]</label>
      <input type="text" id="xn-input" value="1,2,3,4" placeholder="e.g. 1,2,3,4">
    </div>
    <div class="field">
      <label>h[n]</label>
      <input type="text" id="hn-input" value="1,1,0,0" placeholder="e.g. 1,1,0,0">
    </div>
    <button class="compute-btn" onclick="compute()">Compute</button>
  </div>

  <div id="error-msg" class="error-msg" style="display:none"></div>

  <!-- METHOD 1 -->
  <div class="section-title"><span class="badge">01</span> Circle Method</div>
  <div class="method-card">
    <div class="circle-wrapper">
      <canvas id="circle-canvas" width="380" height="380"></canvas>
      <div class="controls">
        <button class="ctrl-btn" id="prev-btn" onclick="prevStep()">← Prev</button>
        <span class="step-indicator" id="step-ind">n = 0</span>
        <button class="ctrl-btn" id="next-btn" onclick="nextStep()">Next →</button>
        <button class="ctrl-btn" id="auto-btn" onclick="toggleAuto()">▶ Auto</button>
      </div>
      <div class="multiplications" id="mult-display">
        <div style="color:var(--muted);font-size:12px">Press Compute to begin.</div>
      </div>
      <div class="yn-display">
        <div class="yn-title">y[n] building up</div>
        <div class="yn-values" id="yn-buildup"></div>
      </div>
    </div>
  </div>

  <!-- METHOD 2 -->
  <div class="section-title"><span class="badge">02</span> Matrix Method</div>
  <div class="method-card">
    <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px">Circulant Matrix Equation</div>
    <div class="matrix-eq" id="matrix-eq-display">
      <div style="color:var(--muted);font-size:12px">Press Compute to see the matrix.</div>
    </div>
    <div style="font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:24px;margin-bottom:12px">Row-by-row Dot Products</div>
    <div class="dot-products" id="dot-products-display"></div>
    <div class="final-result" id="final-result" style="display:none">
      <span class="final-label">y[n] =</span>
      <div class="final-values" id="final-values-display"></div>
    </div>
  </div>

</div>
<script>
let xArr=[], hArr=[], yArr=[], N=0, step=0, autoTimer=null;

function parseSeq(s){ return s.split(',').map(v=>parseFloat(v.trim())).filter(v=>!isNaN(v)); }
function fmt(v){ return Number.isInteger(v)?String(v):parseFloat(v.toFixed(4)).toString(); }

function circConv(x,h,N){
  const y=new Array(N).fill(0);
  for(let n=0;n<N;n++) for(let m=0;m<N;m++) y[n]+=x[m]*h[((n-m)%N+N)%N];
  return y;
}

function buildCirculant(h,N){
  const H=[];
  for(let r=0;r<N;r++){ const row=[]; for(let c=0;c<N;c++) row.push(h[((r-c)%N+N)%N]); H.push(row); }
  return H;
}

function compute(){
  stopAuto();
  const err=document.getElementById('error-msg');
  xArr=parseSeq(document.getElementById('xn-input').value);
  hArr=parseSeq(document.getElementById('hn-input').value);
  if(!xArr.length||!hArr.length){ err.style.display='block'; err.textContent='Error: enter valid comma-separated numbers.'; return; }
  if(xArr.length!==hArr.length){ err.style.display='block'; err.textContent=`x[n] has ${xArr.length} samples, h[n] has ${hArr.length}. Both must have the same length N.`; return; }
  err.style.display='none';
  N=xArr.length; yArr=circConv(xArr,hArr,N); step=0;
  drawCircle(); updateMult(); updateYn();
  renderMatrix();
}

/* ── CIRCLE ─────────────────────────────────────────────── */
function drawCircle(){
  const cv=document.getElementById('circle-canvas');
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height, cx=W/2, cy=H/2;
  const outerR=150, innerR=85, dotR=17;
  ctx.clearRect(0,0,W,H);
  if(!N) return;

  const aStep=(2*Math.PI)/N;

  // Guide rings
  [outerR,innerR].forEach(r=>{
    ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
    ctx.strokeStyle='rgba(124,106,247,0.13)'; ctx.lineWidth=1; ctx.stroke();
  });
  ctx.beginPath(); ctx.arc(cx,cy,(outerR+innerR)/2,0,2*Math.PI);
  ctx.strokeStyle='rgba(124,106,247,0.07)'; ctx.setLineDash([4,6]); ctx.stroke(); ctx.setLineDash([]);

  // Connection lines
  for(let k=0;k<N;k++){
    const angle=-Math.PI/2+k*aStep;
    const ox=cx+outerR*Math.cos(angle), oy=cy+outerR*Math.sin(angle);
    const ix=cx+innerR*Math.cos(angle), iy=cy+innerR*Math.sin(angle);
    const g=ctx.createLinearGradient(ox,oy,ix,iy);
    g.addColorStop(0,'rgba(247,199,106,0.45)');
    g.addColorStop(1,'rgba(124,106,247,0.45)');
    ctx.strokeStyle=g; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ix,iy); ctx.stroke();
  }

  // Outer — x[n] rotated
  for(let k=0;k<N;k++){
    const angle=-Math.PI/2+k*aStep;
    const ox=cx+outerR*Math.cos(angle), oy=cy+outerR*Math.sin(angle);
    const xIdx=((k-step)%N+N)%N;
    ctx.beginPath(); ctx.arc(ox,oy,dotR,0,2*Math.PI);
    ctx.fillStyle='rgba(247,199,106,0.1)'; ctx.fill();
    ctx.strokeStyle='#f7c76a'; ctx.lineWidth=1.8; ctx.stroke();
    ctx.fillStyle='#f7c76a'; ctx.font='bold 13px JetBrains Mono'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(fmt(xArr[xIdx]),ox,oy-3);
    ctx.font='9px JetBrains Mono'; ctx.fillStyle='rgba(247,199,106,0.55)';
    ctx.fillText(`x[${xIdx}]`,ox,oy+7);
  }

  // Inner — h[n] reversed
  for(let k=0;k<N;k++){
    const angle=-Math.PI/2+k*aStep;
    const ix=cx+innerR*Math.cos(angle), iy=cy+innerR*Math.sin(angle);
    const hIdx=(N-k)%N;
    ctx.beginPath(); ctx.arc(ix,iy,dotR,0,2*Math.PI);
    ctx.fillStyle='rgba(124,106,247,0.1)'; ctx.fill();
    ctx.strokeStyle='#7c6af7'; ctx.lineWidth=1.8; ctx.stroke();
    ctx.fillStyle='#7c6af7'; ctx.font='bold 13px JetBrains Mono'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(fmt(hArr[hIdx]),ix,iy-3);
    ctx.font='9px JetBrains Mono'; ctx.fillStyle='rgba(124,106,247,0.55)';
    ctx.fillText(`h[${hIdx}]`,ix,iy+7);
  }

  // Center output
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 11px JetBrains Mono'; ctx.fillStyle='rgba(106,247,196,0.5)';
  ctx.fillText(`y[${step}]`,cx,cy-11);
  ctx.font='bold 20px JetBrains Mono'; ctx.fillStyle='#6af7c4';
  ctx.fillText(fmt(yArr[step]),cx,cy+9);

  // Legend
  ctx.font='10px JetBrains Mono'; ctx.textAlign='center';
  ctx.fillStyle='rgba(247,199,106,0.6)'; ctx.fillText('x[n] — outer (rotates)',cx,13);
  ctx.fillStyle='rgba(124,106,247,0.6)'; ctx.fillText('h[n] — inner (fixed, reversed)',cx,H-7);

  document.getElementById('step-ind').textContent=`n = ${step}`;
}

function updateMult(){
  if(!N) return;
  const el=document.getElementById('mult-display');
  const prods=[], numParts=[];
  for(let k=0;k<N;k++){
    const xIdx=((k-step)%N+N)%N;
    const hIdx=(N-k)%N;
    prods.push(`<span class="mult-pair">${fmt(xArr[xIdx])}×${fmt(hArr[hIdx])}</span>`);
    numParts.push(fmt(xArr[xIdx]*hArr[hIdx]));
  }
  const sep='<span style="color:var(--muted);padding:0 2px">+</span>';
  el.innerHTML=`<div class="mult-row">${prods.join(sep)}</div><div class="sum-line">y[${step}] = ${numParts.join(' + ')} = <strong>${fmt(yArr[step])}</strong></div>`;
}

function updateYn(){
  if(!N) return;
  const el=document.getElementById('yn-buildup');
  el.innerHTML=yArr.map((v,i)=>{
    let cls='yn-chip'+(i<step?' computed':i===step?' current':'');
    return `<span class="${cls}">${i<=step?`y[${i}] = ${fmt(v)}`:`y[${i}] = ?`}</span>`;
  }).join('');
}

function prevStep(){ if(!N) return; stopAuto(); step=(step-1+N)%N; drawCircle(); updateMult(); updateYn(); }
function nextStep(){ if(!N) return; stopAuto(); step=(step+1)%N; drawCircle(); updateMult(); updateYn(); }

function toggleAuto(){
  if(autoTimer){ stopAuto(); return; }
  const btn=document.getElementById('auto-btn');
  btn.classList.add('active'); btn.textContent='■ Stop';
  autoTimer=setInterval(()=>{ step=(step+1)%N; drawCircle(); updateMult(); updateYn(); if(step===0) stopAuto(); },1100);
}
function stopAuto(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
  const btn=document.getElementById('auto-btn');
  btn.classList.remove('active'); btn.textContent='▶ Auto';
}

/* ── MATRIX ─────────────────────────────────────────────── */
function renderMatrix(){
  const H=buildCirculant(hArr,N);
  // Build matrix HTML
  let mRows='';
  for(let r=0;r<N;r++){
    mRows+=`<div class="matrix-row">`;
    for(let c=0;c<N;c++) mRows+=`<span class="matrix-cell${r===c?' diagonal':''}">${fmt(H[r][c])}</span>`;
    mRows+=`</div>`;
  }
  const matHtml=`<div>
    <div style="font-size:10px;color:var(--muted);text-align:center;margin-bottom:6px;letter-spacing:1px">H (circulant)</div>
    <div class="matrix-bracket"><div class="bracket-left"></div><div class="matrix-inner">${mRows}</div><div class="bracket-right"></div></div>
  </div>`;

  const xVecHtml=`<div>
    <div style="font-size:10px;color:var(--muted);text-align:center;margin-bottom:6px;letter-spacing:1px">x</div>
    <div class="matrix-bracket"><div class="bracket-left"></div><div class="vector-inner">${xArr.map(v=>`<div class="vector-cell" style="color:#f7c76a">${fmt(v)}</div>`).join('')}</div><div class="bracket-right"></div></div>
  </div>`;

  const yVecHtml=`<div>
    <div style="font-size:10px;color:var(--muted);text-align:center;margin-bottom:6px;letter-spacing:1px">y</div>
    <div class="matrix-bracket"><div class="bracket-left"></div><div class="vector-inner">${yArr.map(v=>`<div class="vector-cell" style="color:#6af7c4">${fmt(v)}</div>`).join('')}</div><div class="bracket-right"></div></div>
  </div>`;

  document.getElementById('matrix-eq-display').innerHTML=
    `<div class="matrix-label">y</div><div class="eq-sign">=</div>${matHtml}<div class="eq-sign" style="font-size:26px">×</div>${xVecHtml}<div class="eq-sign">=</div>${yVecHtml}`;

  // Dot products
  let dpHtml='';
  for(let r=0;r<N;r++){
    const row=H[r];
    const terms=row.map((h,c)=>`${fmt(h)}·${fmt(xArr[c])}`).join(' + ');
    const nums=row.map((h,c)=>fmt(h*xArr[c])).join(' + ');
    dpHtml+=`<div class="dot-row">
      <div class="row-label">y[${r}]</div>
      <div class="row-calc">= [${row.map(v=>fmt(v)).join(', ')}] · [${xArr.map(v=>fmt(v)).join(', ')}]</div>
      <div class="row-calc">= ${nums}</div>
      <div class="row-result">= ${fmt(yArr[r])}</div>
    </div>`;
  }
  document.getElementById('dot-products-display').innerHTML=dpHtml;

  // Final
  const fr=document.getElementById('final-result');
  fr.style.display='flex';
  document.getElementById('final-values-display').innerHTML=
    yArr.map((v,i)=>`<span class="final-chip">y[${i}] = ${fmt(v)}</span>`).join('');
}

compute();
</script>
</body>
</html>
